name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-companion/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.11.1
        working-directory: android-companion

      - name: Build Debug APK
        run: ./gradlew assembleDebug
        working-directory: android-companion

      - name: Build Release APK
        run: ./gradlew assembleRelease
        working-directory: android-companion

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: keuangan-companion-debug
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: keuangan-companion-release
          path: android-companion/app/build/outputs/apk/release/app-release-unsigned.apk
