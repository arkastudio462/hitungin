name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-companion/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.11.1
        working-directory: android-companion

      - name: Build Debug APK
        run: ./gradlew assembleDebug
        working-directory: android-companion

      - name: Build Release APK
        run: ./gradlew assembleRelease
        working-directory: android-companion

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: keuangan-companion-debug
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: keuangan-companion-release
          path: android-companion/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Read version
        id: version
        run: |
          VERSION=$(grep 'versionName' android-companion/app/build.gradle.kts | sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' | head -1)
          if [ -z "$VERSION" ]; then
            VERSION="1.0.0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Hitungin v${{ steps.version.outputs.version }}
          body: |
            Rilis resmi aplikasi Hitungin Companion.

            **Yang baru di versi ini:**
            - Deteksi otomatis notifikasi bank & e-wallet
            - Parsing transaksi dengan AI
            - Sinkronisasi transaksi ke web app

            **Download:**
            - APK Debug (untuk testing): `keuangan-companion-debug`
            - APK Release: `keuangan-companion-release`
          files: |
            android-companion/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false