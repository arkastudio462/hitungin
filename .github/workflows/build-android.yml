name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-companion/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android-companion/hitungin-release.keystore

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.11.1
        working-directory: android-companion

      - name: Build Release APK
        run: ./gradlew assembleRelease
        working-directory: android-companion
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-companion/hitungin-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Copy APK with app name
        run: cp android-companion/app/build/outputs/apk/release/app-release.apk android-companion/app/build/outputs/apk/release/hitungin.apk

      - name: Read version
        id: version
        run: |
          VERSION=$(grep 'versionName' android-companion/app/build.gradle.kts | sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' | head -1)
          if [ -z "$VERSION" ]; then
            VERSION="1.0.0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Hitungin v${{ steps.version.outputs.version }}
          body: |
            Rilis resmi aplikasi Hitungin Companion.

            **Yang baru di versi ini:**
            - Deteksi otomatis notifikasi bank & e-wallet
            - Parsing transaksi dengan AI
            - Sinkronisasi transaksi ke web app

            **Download:**
            - `hitungin.apk` — rilis resmi, siap install
          files: |
            android-companion/app/build/outputs/apk/release/hitungin.apk
          draft: false
          prerelease: false